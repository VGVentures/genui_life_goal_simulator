name: Model Benchmark

# Runs the headless model benchmark (real system prompt + GenUI parser, no UI)
# against every provider that has an API key secret, then publishes the HTML
# report (build artifact + Firebase Hosting) and opens/updates a PR on the
# website repo with the machine-readable genui-benchmarks.json.
#
# Triggered manually only (workflow_dispatch). It makes real, paid API calls,
# so it never runs on a schedule or on PRs — only when a maintainer starts it.
# workflow_dispatch requires write access to the repo, so only maintainers can.
#
# Incremental by default: each run restores the previous run's results, then
# the `mode` input decides what to run. `new-and-failed` (default) benchmarks
# models that have no result yet AND re-runs any whose restored result had a
# failed turn, while leaving cleanly-passed models untouched — so failures get
# retried and successes are never re-paid for. `new` fills only missing models;
# `all` re-benchmarks everything from scratch.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which models to benchmark'
        type: choice
        default: new-and-failed
        options:
          - new-and-failed # new models + retry failures; keep clean passes
          - new # only models without a result yet
          - all # re-benchmark every model from scratch
      iterations:
        description: 'Iterations per model'
        required: false
        default: '5'
      turns:
        description: 'Round trips per iteration'
        required: false
        default: '3'

permissions:
  contents: read
  actions: read # needed to list and download artifacts from previous runs

jobs:
  benchmark:
    name: Run benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - id: read_fvm
        name: Extract Flutter version from .fvmrc
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.read_fvm.outputs.version }}

      - run: flutter pub get

      - name: Write API keys
        run: |
          cat > benchmark/keys.env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          KIMI_API_KEY=${{ secrets.KIMI_API_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          INCEPTION_API_KEY=${{ secrets.INCEPTION_API_KEY }}
          EOF

      - name: Restore previous results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark/results
          prev=$(gh run list --workflow benchmark.yaml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$prev" ]; then
            echo "Restoring results from previous run $prev"
            gh run download "$prev" --name benchmark-report --dir /tmp/prev || true
            if [ -d /tmp/prev/results ]; then
              cp -a /tmp/prev/results/. benchmark/results/ || true
            fi
            echo "Restored $(ls benchmark/results/*.json 2>/dev/null | wc -l) result file(s)."
          else
            echo "No previous successful run to restore from; starting fresh."
          fi

      - name: Run benchmark and build report
        env:
          FLUTTER: flutter
          BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '5' }}
          BENCHMARK_TURNS: ${{ github.event.inputs.turns || '3' }}
          MODE: ${{ github.event.inputs.mode || 'new-and-failed' }}
        run: |
          case "$MODE" in
            new)
              dart run tool/run_benchmark.dart --only-new ;;
            new-and-failed)
              dart run tool/run_benchmark.dart --only-new --rerun-failed ;;
            all)
              dart run tool/run_benchmark.dart ;;
            *)
              echo "Unknown mode: $MODE" >&2; exit 1 ;;
          esac

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: |
            benchmark/report.html
            benchmark/results/
          if-no-files-found: warn

      # Publish the freshly built report to its own Firebase Hosting site
      # (genui-benchmarks.web.app). The whole workflow is manual-only, so this
      # publishes on every run. Decoupled from the Flutter app's deploy in
      # main.yaml: a static report needs none of the app's Firebase config, so
      # we write a minimal firebase.json inline that names the target site
      # directly. No FIREBASE_JSON/FIREBASERC secret is involved — only the
      # service account and project ID, which already exist.
      #
      # This publish tail is `continue-on-error`: results + report are already
      # uploaded as an artifact above (if: always()), and the incremental
      # restore only reuses runs whose job concluded success. A publish failure
      # must NOT fail the job, or it would break the restore chain and force a
      # full (paid) re-benchmark next run. The failed step still shows in logs.
      - name: Prepare report for hosting
        if: always()
        id: prep_report
        continue-on-error: true
        run: |
          if [ -f benchmark/report.html ]; then
            mkdir -p benchmark/public
            cp benchmark/report.html benchmark/public/index.html
            printf '%s' '{"hosting":{"site":"genui-benchmarks","public":"benchmark/public","ignore":["firebase.json","**/.*","**/node_modules/**"]}}' > firebase.json
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No benchmark/report.html was produced; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy report to Firebase Hosting
        if: always() && steps.prep_report.outputs.ready == 'true'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}

      # Publish the machine data file to verygood.ventures by opening (or
      # updating) a PR on VGVentures/vgv-website-claude, mirroring that repo's
      # own oss-stats branch-reuse pattern: a fixed branch, force-pushed and
      # reused, one open PR at a time.
      #
      # Auth is a GitHub App owned by the VGV org (WEBSITE_APP_ID +
      # WEBSITE_APP_PRIVATE_KEY), installed on the website repo with
      # contents:write + pull-requests:write. A short-lived installation token is
      # minted per run — deliberately NOT this repo's GITHUB_TOKEN. Because the
      # push is authored by the App rather than the website's own token, that
      # repo's CI (build + zod validation, spell check, preview deploy) DOES run
      # on the PR, so a malformed payload is caught before merge. The App belongs
      # to the org, so it outlives any one person's access changing.
      #
      # Both steps are continue-on-error and the publish only runs when the token
      # minted and the JSON exists: results + report are already uploaded as an
      # artifact, and the incremental restore only reuses runs whose job
      # concluded success — a publish failure must NOT fail the job, or it would
      # break the restore chain and force a full (paid) re-benchmark next run.
      - name: Mint website App token
        if: always()
        id: website_app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WEBSITE_APP_ID }}
          private-key: ${{ secrets.WEBSITE_APP_PRIVATE_KEY }}
          owner: VGVentures
          repositories: vgv-website-claude

      - name: Open or update website benchmarks PR
        if: always() && steps.website_app_token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.website_app_token.outputs.token }}
        run: |
          set -euo pipefail
          if [ ! -f benchmark/genui-benchmarks.json ]; then
            echo "No benchmark/genui-benchmarks.json was produced; skipping website PR."
            exit 0
          fi

          repo="VGVentures/vgv-website-claude"
          branch="chore/update-genui-benchmarks"
          data_path="astro/src/data/genui-benchmarks.json"
          workdir="$RUNNER_TEMP/vgv-website"

          rm -rf "$workdir"
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${repo}.git" "$workdir"
          mkdir -p "$workdir/$(dirname "$data_path")"
          cp benchmark/genui-benchmarks.json "$workdir/$data_path"

          cd "$workdir"
          git add "$data_path"
          if git diff --cached --quiet; then
            echo "genui-benchmarks.json already matches the site; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "chore: update GenUI benchmarks"
          git push --force origin "$branch"

          existing=$(gh pr list --repo "$repo" --head "$branch" --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$existing" ]; then
            gh pr create --repo "$repo" --base main --head "$branch" \
              --title "chore: update GenUI benchmarks" \
              --body "$(cat <<'EOF'
          Automated update of the GenUI model benchmarks from the
          `genui_life_goal_simulator` benchmark workflow.

          Refreshes `astro/src/data/genui-benchmarks.json` with the latest
          headless benchmark run (real system prompt + GenUI parser, no UI). The
          file is validated at build time against `benchmarksSchema` in
          `astro/src/lib/genui-benchmarks.ts`, so CI (Type Check & Build, spell
          check, preview deploy) runs on this PR and a malformed payload fails
          the build before it can ship.

          > Generated by the `Model Benchmark` workflow. Merge to publish the
          > updated numbers.
          EOF
          )"
          else
            echo "PR #$existing already open — branch updated."
          fi
