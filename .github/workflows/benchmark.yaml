name: Model Benchmark

# Runs the headless model benchmark (real system prompt + GenUI parser, no UI)
# against every provider that has an API key secret, then publishes the HTML
# report as a build artifact.
#
# Triggered manually, or weekly. Not run on PRs — it makes real, paid API calls.
#
# Incremental by default: each run restores the previous run's results, then
# (when only_new is true) benchmarks only models that don't have a result yet,
# so newly added models get filled in without re-paying for the rest. Set
# only_new to false to re-benchmark every model from scratch.

on:
  workflow_dispatch:
    inputs:
      only_new:
        description: 'Only benchmark models without an existing result'
        type: boolean
        default: true
      iterations:
        description: 'Iterations per model'
        required: false
        default: '5'
      turns:
        description: 'Round trips per iteration'
        required: false
        default: '3'
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  actions: read # needed to list and download artifacts from previous runs

jobs:
  benchmark:
    name: Run benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - id: read_fvm
        name: Extract Flutter version from .fvmrc
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.read_fvm.outputs.version }}

      - run: flutter pub get

      - name: Write API keys
        run: |
          cat > benchmark/keys.env <<EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          KIMI_API_KEY=${{ secrets.KIMI_API_KEY }}
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          INCEPTION_API_KEY=${{ secrets.INCEPTION_API_KEY }}
          EOF

      - name: Restore previous results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p benchmark/results
          prev=$(gh run list --workflow benchmark.yaml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$prev" ]; then
            echo "Restoring results from previous run $prev"
            gh run download "$prev" --name benchmark-report --dir /tmp/prev || true
            if [ -d /tmp/prev/results ]; then
              cp -a /tmp/prev/results/. benchmark/results/ || true
            fi
            echo "Restored $(ls benchmark/results/*.json 2>/dev/null | wc -l) result file(s)."
          else
            echo "No previous successful run to restore from; starting fresh."
          fi

      - name: Run benchmark and build report
        env:
          FLUTTER: flutter
          BENCHMARK_ITERATIONS: ${{ github.event.inputs.iterations || '5' }}
          BENCHMARK_TURNS: ${{ github.event.inputs.turns || '3' }}
          ONLY_NEW: ${{ github.event.inputs.only_new || 'true' }}
        run: |
          if [ "$ONLY_NEW" = "true" ]; then
            dart run tool/run_benchmark.dart --only-new
          else
            dart run tool/run_benchmark.dart
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            benchmark/report.html
            benchmark/results/
          if-no-files-found: warn
